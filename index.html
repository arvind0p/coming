<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <title>Website Coming Soon</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f8fafc;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 20%, rgba(59, 130, 246, .22), transparent 32%),
        radial-gradient(circle at 82% 78%, rgba(14, 165, 233, .15), transparent 30%),
        #0b1220;
    }
    .card {
      width: min(720px, 100%);
      padding: clamp(36px, 7vw, 72px) 24px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 28px;
      background: rgba(255,255,255,.045);
      box-shadow: 0 24px 80px rgba(0,0,0,.28);
      backdrop-filter: blur(12px);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 14px;
      border: 1px solid rgba(96,165,250,.35);
      border-radius: 999px;
      color: #bfdbfe;
      background: rgba(37,99,235,.12);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #60a5fa;
      box-shadow: 0 0 12px #60a5fa;
    }
    h1 {
      margin: 28px 0 16px;
      font-size: clamp(42px, 8vw, 76px);
      line-height: 1.02;
      letter-spacing: -.055em;
    }
    h1 span { color: #60a5fa; }
    p {
      max-width: 480px;
      margin: 0 auto;
      color: #aab6c8;
      font-size: clamp(15px, 2.4vw, 18px);
      line-height: 1.75;
    }
    .line {
      width: 72px;
      height: 3px;
      margin: 32px auto 0;
      border-radius: 99px;
      background: linear-gradient(90deg, #60a5fa, #22d3ee);
    }
    footer {
      margin-top: 44px;
      color: #718096;
      font-size: 12px;
      letter-spacing: .04em;
    }
    @media (prefers-reduced-motion: no-preference) {
      .card { animation: appear .7s ease-out both; }
      @keyframes appear {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge"><span class="dot"></span> Something exciting is in the works</div>
    <h1>Website is <span>Coming Soon.</span></h1>
    <p>We’re working behind the scenes to bring you something great. Please check back soon.</p>
    <div class="line"></div>
    <footer>© <span id="year"></span> All rights reserved.</footer>
  </main>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
